<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriShop – My Listings</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0b0f0c;
  --surface: #111810;
  --card:    #141c15;
  --border:  #1e2b1f;
  --green:   #3ab557;
  --green2:  #2d9648;
  --gold:    #c8a84b;
  --red:     #e05252;
  --muted:   #6b7c6d;
  --text:    #e8f0e9;
  --radius:  12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* NAV */
nav{display:flex;align-items:center;padding:14px 5%;border-bottom:1px solid var(--border);gap:20px;position:sticky;top:0;background:var(--bg);z-index:100}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--green);text-decoration:none}
.logo em{color:var(--text);font-style:normal}
.nav-back{color:var(--muted);text-decoration:none;font-size:13px}
.nav-right{margin-left:auto}
.nav-pill{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:4px}
.nav-pill a{padding:6px 14px;border-radius:24px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;transition:.18s}
.nav-pill a.active,.nav-pill a:hover{background:var(--green);color:#000}

/* SHELL */
.shell{max-width:1100px;margin:0 auto;padding:30px 5%}

/* PAGE HEADER */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.page-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:800}
.page-title em{color:var(--green);font-style:normal}
.btn-add{background:var(--green);color:#000;border:none;padding:10px 20px;border-radius:var(--radius);font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.18s}
.btn-add:hover{background:var(--green2);color:#fff}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.stat-box-label{font-size:10px;font-family:'DM Mono',monospace;letter-spacing:1px;color:var(--muted);margin-bottom:8px}
.stat-box-val{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--green)}
.stat-box-val.gold{color:var(--gold)}

/* FILTERS */
.filter-bar{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px 10px 36px;border-radius:var(--radius);font-size:14px;font-family:'DM Sans',sans-serif}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px}
.f-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:var(--radius);font-size:13px;cursor:pointer}

/* LISTING GRID */
.listing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}

.listing-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.2s;position:relative}
.listing-card:hover{border-color:var(--green);transform:translateY(-2px)}

.listing-img{width:100%;height:160px;object-fit:cover;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:48px}
.listing-img img{width:100%;height:100%;object-fit:cover}
.listing-img.no-img{display:flex;align-items:center;justify-content:center;font-size:52px;background:var(--surface)}

.listing-body{padding:14px}
.listing-tag{font-size:10px;font-family:'DM Mono',monospace;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.listing-name{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:4px}
.listing-desc{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.listing-foot{display:flex;align-items:center;justify-content:space-between}
.listing-price{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--green)}
.listing-stock{font-size:11px;color:var(--muted)}

.status-pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;font-family:'DM Mono',monospace;letter-spacing:.5px}
.s-active  {background:rgba(58,181,87,.15);color:var(--green)}
.s-soldout {background:rgba(224,82,82,.15);color:var(--red)}
.s-hidden  {background:rgba(107,124,109,.15);color:var(--muted)}

.listing-actions{display:flex;gap:8px;margin-top:12px}
.btn-sm{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:.15s}
.btn-sm:hover{border-color:var(--green);color:var(--green)}
.btn-sm.del:hover{border-color:var(--red);color:var(--red)}

/* EMPTY */
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty .ei{font-size:56px;margin-bottom:16px}
.empty .et{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px}
.empty .es{font-size:14px}

/* MODAL OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}

/* MODAL */
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:28px}
.modal-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:22px;display:flex;align-items:center;gap:8px}

/* IMAGE UPLOAD AREA */
.img-upload-area{border:2px dashed var(--border);border-radius:var(--radius);text-align:center;padding:24px;cursor:pointer;transition:.2s;margin-bottom:18px;position:relative}
.img-upload-area:hover{border-color:var(--green)}
.img-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-preview{width:100%;height:160px;object-fit:cover;border-radius:8px;display:none;margin-bottom:8px}
.img-upload-icon{font-size:32px;margin-bottom:8px}
.img-upload-text{font-size:13px;color:var(--muted)}
.img-upload-sub{font-size:11px;color:var(--muted);margin-top:4px}

/* FORM */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg.full{grid-column:1/-1}
.fl{font-size:10px;font-family:'DM Mono',monospace;letter-spacing:1px;color:var(--muted)}
.fi{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;width:100%;transition:.15s}
.fi:focus{outline:none;border-color:var(--green)}
textarea.fi{resize:vertical;min-height:80px}

.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn-cancel{background:transparent;border:1px solid var(--border);color:var(--muted);padding:10px 20px;border-radius:var(--radius);font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-save{background:var(--green);color:#000;border:none;padding:10px 24px;border-radius:var(--radius);font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px}
.btn-save:hover{background:var(--green2);color:#fff}
.btn-save:disabled{opacity:.5;cursor:not-allowed}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transform:translateY(8px);transition:.3s;z-index:999;pointer-events:none}

@media(max-width:700px){
  .stats-row{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr}
  .fg.full{grid-column:1}
}
</style>
</head>
<body>

<script src="userProfile/Authutils.js"></script>
<script>requireAuth();</script>

<nav>
  <a href="index.html" class="logo">Agri<em>Shop</em></a>
  <a href="index.html" class="nav-back">← Home</a>
  <div class="nav-right">
    <div class="nav-pill">
      <a href="index.html">🏠 Shop</a>
      <a href="userProfile/index.html">👤 Profile</a>
      <a href="myListings.html" class="active">📦 My Listings</a>
    </div>
  </div>
</nav>

<div class="shell">

  <!-- Header -->
  <div class="page-header">
    <div class="page-title">📦 <em>My</em> Listings</div>
    <button class="btn-add" onclick="openModal()">+ Add New Listing</button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-box"><div class="stat-box-label">TOTAL LISTINGS</div><div class="stat-box-val" id="stat-total">0</div></div>
    <div class="stat-box"><div class="stat-box-label">ACTIVE</div><div class="stat-box-val" id="stat-active">0</div></div>
    <div class="stat-box"><div class="stat-box-label">SOLD OUT</div><div class="stat-box-val" id="stat-sold">0</div></div>
    <div class="stat-box"><div class="stat-box-label">TOTAL REVENUE</div><div class="stat-box-val gold" id="stat-rev">TK 0</div></div>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="search-wrap">
      <input class="search-input" id="search" placeholder="Search listings..." oninput="renderListings()">
    </div>
    <select class="f-select" id="filter-status" onchange="renderListings()">
      <option value="">All Status</option>
      <option>Active</option>
      <option>Sold Out</option>
      <option>Hidden</option>
    </select>
    <select class="f-select" id="filter-cat" onchange="renderListings()">
      <option value="">All Categories</option>
      <option>Cereals & Grains</option>
      <option>Vegetables</option>
      <option>Fruits</option>
      <option>Dairy</option>
      <option>Meat</option>
      <option>Eggs</option>
      <option>Oilseeds</option>
      <option>Spices & Herbs</option>
      <option>Aquaculture</option>
      <option>Processed</option>
      <option>Other</option>
    </select>
  </div>

  <!-- Grid -->
  <div class="listing-grid" id="listing-grid"></div>

</div>

<!-- ADD / EDIT MODAL -->
<div class="overlay" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-title">➕ Add New Listing</div>

    <!-- Image upload -->
    <div class="img-upload-area" id="upload-area" onclick="triggerFileInput()">
      <input type="file" id="img-input" accept="image/jpeg,image/png,image/webp" onchange="previewImage(event)" onclick="event.stopPropagation()">
      <img class="img-preview" id="img-preview" alt="preview">
      <div id="upload-placeholder">
        <div class="img-upload-icon">📷</div>
        <div class="img-upload-text">Click to upload product photo</div>
        <div class="img-upload-sub">JPG, PNG or WEBP · max 3 MB</div>
      </div>
    </div>

    <div class="fgrid">
      <div class="fg full">
        <label class="fl">PRODUCT NAME</label>
        <input class="fi" id="f-name" placeholder="e.g. Fresh Tomatoes">
      </div>
      <div class="fg">
        <label class="fl">CATEGORY</label>
        <select class="fi" id="f-category">
          <option value="">Select...</option>
          <option>Cereals & Grains</option>
          <option>Vegetables</option>
          <option>Fruits</option>
          <option>Dairy</option>
          <option>Meat</option>
          <option>Eggs</option>
          <option>Oilseeds</option>
          <option>Spices & Herbs</option>
          <option>Aquaculture</option>
          <option>Processed</option>
          <option>Other</option>
        </select>
      </div>
      <div class="fg">
        <label class="fl">STATUS</label>
        <select class="fi" id="f-status">
          <option>Active</option>
          <option>Sold Out</option>
          <option>Hidden</option>
        </select>
      </div>
      <div class="fg">
        <label class="fl">PRICE (TK)</label>
        <input class="fi" id="f-price" type="number" placeholder="e.g. 80" min="0">
      </div>
      <div class="fg">
        <label class="fl">UNIT</label>
        <select class="fi" id="f-unit">
          <option>kg</option>
          <option>piece</option>
          <option>dozen</option>
          <option>litre</option>
          <option>bag</option>
          <option>bundle</option>
          <option>quintal</option>
        </select>
      </div>
      <div class="fg">
        <label class="fl">STOCK AVAILABLE</label>
        <input class="fi" id="f-stock" type="number" placeholder="e.g. 50" min="0">
      </div>
      <div class="fg">
        <label class="fl">EMOJI / ICON</label>
        <input class="fi" id="f-emoji" placeholder="e.g. 🍅" maxlength="4">
      </div>
      <div class="fg full">
        <label class="fl">DESCRIPTION</label>
        <textarea class="fi" id="f-desc" placeholder="Describe your product quality, origin, harvest date..."></textarea>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal()">✕ Cancel</button>
      <button class="btn-save" id="save-btn" onclick="saveListing()">💾 Save Listing</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="userProfile/Authutils.js"></script>
<script>
const API = 'http://127.0.0.1:5000/api';
let listings = [];
let editId   = null;

// ── AUTH HEADER ────────────────────────────────────────────────────────────
function authHeader() {
  const token = localStorage.getItem('agri_token');
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

// ── LOAD FROM DB ───────────────────────────────────────────────────────────
async function loadListings() {
  try {
    const res  = await fetch(`${API}/listings`, { headers: authHeader() });
    const data = await res.json();
    if (data.success) {
      listings = data.listings;
      renderListings();
      updateStats();
    }
  } catch {
    showToast('Cannot connect to server.', true);
  }
}

// ── RENDER CARDS ───────────────────────────────────────────────────────────
function renderListings() {
  const q      = document.getElementById('search').value.toLowerCase();
  const status = document.getElementById('filter-status').value;
  const cat    = document.getElementById('filter-cat').value;

  let filtered = listings.filter(l => {
    const matchQ = !q || l.name.toLowerCase().includes(q) || (l.description||'').toLowerCase().includes(q);
    const matchS = !status || l.status === status;
    const matchC = !cat    || l.category === cat;
    return matchQ && matchS && matchC;
  });

  const grid = document.getElementById('listing-grid');

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="ei">🌱</div>
        <div class="et">No listings yet</div>
        <div class="es">Add your first product to start selling!</div>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(l => {
    const imgHTML = l.image
      ? `<div class="listing-img"><img src="/uploads/listings/${l.image}" alt="${l.name}" onerror="this.parentElement.innerHTML='<span style=font-size:52px>${l.emoji||'🌿'}</span>'"></div>`
      : `<div class="listing-img no-img">${l.emoji || '🌿'}</div>`;

    const pill = l.status === 'Active'   ? 's-active'  :
                 l.status === 'Sold Out' ? 's-soldout' : 's-hidden';

    return `
    <div class="listing-card">
      ${imgHTML}
      <div class="listing-body">
        <div class="listing-tag">${l.category} &nbsp;·&nbsp; <span class="status-pill ${pill}">${l.status}</span></div>
        <div class="listing-name">${l.name}</div>
        <div class="listing-desc">${l.description || 'No description.'}</div>
        <div class="listing-foot">
          <div>
            <div class="listing-price">TK ${Number(l.price).toLocaleString('en-IN')} <span style="font-size:12px;font-weight:400;color:var(--muted)">/ ${l.unit}</span></div>
            <div class="listing-stock">Stock: ${l.stock} ${l.unit}</div>
          </div>
        </div>
        <div class="listing-actions">
          <button class="btn-sm" onclick="openEdit('${l._id}')">✎ Edit</button>
          <button class="btn-sm del" onclick="deleteListing('${l._id}')">🗑 Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── STATS ──────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('stat-total').textContent  = listings.length;
  document.getElementById('stat-active').textContent = listings.filter(l => l.status === 'Active').length;
  document.getElementById('stat-sold').textContent   = listings.filter(l => l.status === 'Sold Out').length;
  const rev = listings.reduce((s, l) => s + (l.revenue || 0), 0);
  document.getElementById('stat-rev').textContent    = 'TK ' + rev.toLocaleString('en-IN');
}

// ── IMAGE UPLOAD PREVIEW ───────────────────────────────────────────────────
function triggerFileInput() {
  document.getElementById('img-input').click();
}

function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const prev = document.getElementById('img-preview');
    prev.src   = ev.target.result;
    prev.style.display = 'block';
    document.getElementById('upload-placeholder').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function resetImageUpload() {
  document.getElementById('img-input').value = '';
  document.getElementById('img-preview').style.display = 'none';
  document.getElementById('upload-placeholder').style.display = 'block';
}

// ── MODAL OPEN / CLOSE ─────────────────────────────────────────────────────
function openModal() {
  editId = null;
  document.querySelector('.modal-title').textContent = '➕ Add New Listing';
  ['f-name','f-price','f-stock','f-emoji','f-desc'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-category').value = '';
  document.getElementById('f-status').value   = 'Active';
  document.getElementById('f-unit').value     = 'kg';
  resetImageUpload();
  document.getElementById('modal-overlay').classList.add('open');
}

function openEdit(id) {
  const l = listings.find(x => x._id === id);
  if (!l) return;
  editId = id;
  document.querySelector('.modal-title').textContent = '✎ Edit Listing';
  document.getElementById('f-name').value     = l.name;
  document.getElementById('f-category').value = l.category;
  document.getElementById('f-status').value   = l.status;
  document.getElementById('f-price').value    = l.price;
  document.getElementById('f-unit').value     = l.unit;
  document.getElementById('f-stock').value    = l.stock;
  document.getElementById('f-emoji').value    = l.emoji || '';
  document.getElementById('f-desc').value     = l.description || '';

  // show existing image if present
  if (l.image) {
    const prev = document.getElementById('img-preview');
    prev.src   = `/uploads/listings/${l.image}`;
    prev.style.display = 'block';
    document.getElementById('upload-placeholder').style.display = 'none';
  } else {
    resetImageUpload();
  }

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function overlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

// ── SAVE (CREATE or UPDATE) ────────────────────────────────────────────────
async function saveListing() {
  const name     = document.getElementById('f-name').value.trim();
  const category = document.getElementById('f-category').value;
  const price    = document.getElementById('f-price').value;

  if (!name || !category || !price) {
    showToast('Name, category and price are required.', true);
    return;
  }

  const btn = document.getElementById('save-btn');
  btn.textContent = '⏳ Saving…';
  btn.disabled    = true;

  // Use FormData so image file can be sent
  const fd = new FormData();
  fd.append('name',        name);
  fd.append('category',    category);
  fd.append('status',      document.getElementById('f-status').value);
  fd.append('price',       price);
  fd.append('unit',        document.getElementById('f-unit').value);
  fd.append('stock',       document.getElementById('f-stock').value || 0);
  fd.append('emoji',       document.getElementById('f-emoji').value);
  fd.append('description', document.getElementById('f-desc').value);

  const imgFile = document.getElementById('img-input').files[0];
  if (imgFile) fd.append('image', imgFile);

  try {
    const url    = editId ? `${API}/listings/${editId}` : `${API}/listings`;
    const method = editId ? 'PUT' : 'POST';

    const res  = await fetch(url, { method, headers: authHeader(), body: fd });
    const data = await res.json();

    if (!data.success) {
      showToast(data.message, true);
      return;
    }

    if (editId) {
      listings = listings.map(l => l._id === editId ? data.listing : l);
      showToast('✅ Listing updated!');
    } else {
      listings.unshift(data.listing);
      showToast('✅ Listing added!');
    }

    renderListings();
    updateStats();
    closeModal();
  } catch {
    showToast('Cannot connect to server.', true);
  } finally {
    btn.textContent = '💾 Save Listing';
    btn.disabled    = false;
  }
}

// ── DELETE ─────────────────────────────────────────────────────────────────
async function deleteListing(id) {
  if (!confirm('Delete this listing?')) return;
  try {
    const res  = await fetch(`${API}/listings/${id}`, { method: 'DELETE', headers: authHeader() });
    const data = await res.json();
    if (data.success) {
      listings = listings.filter(l => l._id !== id);
      renderListings();
      updateStats();
      showToast('🗑 Listing deleted.');
    }
  } catch {
    showToast('Cannot connect to server.', true);
  }
}

// ── TOAST ──────────────────────────────────────────────────────────────────
function showToast(msg, err = false) {
  const t = document.getElementById('toast');
  t.textContent       = msg;
  t.style.background  = err ? 'var(--red)' : 'var(--green)';
  t.style.color       = err ? '#fff' : '#000';
  t.style.opacity     = '1';
  t.style.transform   = 'translateY(0)';
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; }, 2800);
}

// ── INIT ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', loadListings);
</script>
